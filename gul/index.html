<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gül</title>
<style>
:root{color-scheme:dark;--bg:#0b0509;--dim:#8a6a78;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0509;--dim:#8a6a78}}
:root[data-theme="dark"]{--bg:#0b0509;--dim:#8a6a78}
html,body{height:100%;margin:0;background:var(--bg)}
body{overflow:hidden}
canvas{display:block;width:100%;height:100%}
#h{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);pointer-events:none;opacity:0;transition:opacity 1.5s}
</style></head><body>
<canvas id="c"></canvas><div id="h">Dokun, gül yeniden açılsın.</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hint=document.getElementById('h');
const NAME='EBRAR',RAMP=" .`'-:;ilI!1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const TAU=Math.PI*2,GA=2.39996,TILT=.42,cT=Math.cos(TILT),sT=Math.sin(TILT),HB=.15,FL=-1.28;
const sm=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
const nrm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function colr(k,l){let c;
 if(k===0)c=[70,210,110];else if(k===1)c=[50,180,90];
 else if(k===2){const w=Math.max(0,(l-.6)/.4);c=[255,40+150*w,76+130*w]}
 else if(k===3)c=[255,170,200];else if(k===4)c=[255,255,255];else c=[255,110,150];
 return `rgb(${c[0]*l|0},${c[1]*l|0},${c[2]*l|0})`}
const STY=[0,1,2,3,4,5].map(k=>Array.from({length:16},(_,i)=>colr(k,(i+1)/16)));
let W,H,dpr,cw,ch,cols,rows,S,upMid,gx0,gy0,NF,Z,CC,KD,LV,PT;
let cY=1,sY=0,LX,LY,LZ,HX,HY,HZ,RX,RY,RZ;

// stem, leaves, sepals (static)
const stemC=s=>[.04*Math.sin(s*3.1+.4)-.02,-1.25+s*1.4,.02*Math.sin(s*2)];
const ST=[],LF=[];
for(let k=0;k<=260;k++){const s=k/260,c=stemC(s),r=.026+.006*(1-s);
 for(let j=0;j<10;j++){const a=j/10*TAU,nx=Math.cos(a),nz=Math.sin(a);ST.push([c[0]+nx*r,c[1],c[2]+nz*r,nx,0,nz,s,20])}}
function leaf(at,side,len,lift){
 const b=stemC(at),d=nrm([side*Math.cos(lift),Math.sin(lift),.2]),w=nrm([d[1],-d[0],0]);
 let up=nrm(crs(w,d));if(up[1]<0)up=up.map(x=>-x);
 for(let i=0;i<=60;i++){const s=i/60;
  for(let j=0;j<=16;j++){const v=j/8-1,hw=.13*Math.pow(Math.sin(Math.PI*s),.75)*len/.4;
   const o=.04+s*len,l=v*hw,h=.05*Math.abs(v)*(hw/.13)-.09*s*s;
   LF.push([b[0]+d[0]*o+w[0]*l+up[0]*h,b[1]+d[1]*o+w[1]*l+up[1]*h,b[2]+d[2]*o+w[2]*l+up[2]*h,up[0],up[1],up[2],at+.05+s*.25,21])}}}
leaf(.3,-1,.5,.35);leaf(.52,1,.42,.45);
for(let n=0;n<5;n++){const a0=n/5*TAU+.3;
 for(let i=0;i<=22;i++){const s=i/22;
  for(let j=0;j<=6;j++){const w=j/3-1,be=1.1+.95*s,L=.3,r=.04+L*s*Math.sin(be),an=a0+w*.13*(1-s);
   LF.push([Math.cos(an)*r,HB+.02+L*s*Math.cos(be),Math.sin(an)*r,Math.cos(a0)*Math.cos(be),-Math.sin(be)*.5+.5,Math.sin(a0)*Math.cos(be),.97+.08*s,22])}}}

// the flower: one spiral surface (classic rose curve), blended from an egg-shaped bud
const NT=900,NX=34,NP=NT*NX,TH0=2.2*Math.PI,TH1=20*Math.PI;
const PG=new Float32Array(NP*6),PX=new Float32Array(NP),PTH=new Float32Array(NP),PSJ=new Float32Array(NP),PPT=new Uint8Array(NP),DEW=new Uint8Array(NP);
for(let ix=0;ix<NX;ix++)for(let jt=0;jt<NT;jt++){const i=ix*NT+jt,th=TH0+(TH1-TH0)*jt/(NT-1);
 PX[i]=ix/(NX-1);PTH[i]=th;PSJ[i]=1-jt/(NT-1);PPT[i]=1+(Math.floor(3.6*th/TAU)%50);
 if(i%131===0&&PSJ[i]>.55&&PX[i]>.6)DEW[i]=1}
let lastB=-1;
function build(b){lastB=b;
 const A=1.6+4*b,w=sm(b/.6);
 for(let i=0;i<NP;i++){const x=PX[i],th=PTH[i],thn=1-PSJ[i];
  const phi=Math.PI/2*Math.exp(-th/(A*Math.PI));
  const m=1.25*(1-((3.6*th)%TAU)/Math.PI),X=1-.5*Math.pow(m*m-.25,2);
  const yy=1.95653*x*x*Math.pow(1.27689*x-1,2)*Math.sin(phi);
  const r=X*(x*Math.sin(phi)+yy*Math.cos(phi));
  let px=r*Math.sin(th)*.8*(1.05-.05*b),py=X*(x*Math.cos(phi)-yy*Math.sin(phi))*.8*(.84+.16*b)+HB+.07,pz=r*Math.cos(th)*.8*(1.05-.05*b);
  const rb=.2*Math.pow(Math.sin(Math.PI*x),.8)*(1-.3*thn)+.003,by=HB+.1+.6*x*(1-.06*thn);
  const k=i*6;PG[k]=rb*Math.sin(th)*(1-w)+px*w;PG[k+1]=by*(1-w)+py*w;PG[k+2]=rb*Math.cos(th)*(1-w)+pz*w}
 for(let ix=0;ix<NX;ix++)for(let jt=0;jt<NT;jt++){
  const i=ix*NT+jt,a=ix*NT+Math.max(0,jt-1),c=ix*NT+Math.min(NT-1,jt+1),d=Math.max(0,ix-1)*NT+jt,e=Math.min(NX-1,ix+1)*NT+jt;
  const du=[PG[c*6]-PG[a*6],PG[c*6+1]-PG[a*6+1],PG[c*6+2]-PG[a*6+2]],dv=[PG[e*6]-PG[d*6],PG[e*6+1]-PG[d*6+1],PG[e*6+2]-PG[d*6+2]];
  let n=nrm(crs(du,dv));const th=PTH[i];
  if(n[0]*Math.sin(th)+.2*n[1]+n[2]*Math.cos(th)<0)n=[-n[0],-n[1],-n[2]];
  PG[i*6+3]=n[0];PG[i*6+4]=n[1];PG[i*6+5]=n[2]}}
const DUST=Array.from({length:260},(_,i)=>{let s=i*977+13;const r=()=>(s=(s*16807)%2147483647)/2147483647;return[r(),r(),r(),r(),r()]});
const DR=[[.55,.2,.35,27],[-.6,.18,.2,30],[.25,.14,.7,33.5]];

function plot(x,y,z,nx,ny,nz,kind,pt,sh,flash){
 const x1=x*cY+z*sY,z1=-x*sY+z*cY,up=y*cT-z1*sT,d=y*sT+z1*cT;
 const i=(gx0+x1*S)|0,j=(rows/2-(up-upMid)*S*cw/ch)|0;
 if(i<0||i>=cols||j<0||j>=rows)return;
 const k=j*cols+i;if(d<=Z[k])return;
 const a=nx*cY+nz*sY,c=-nx*sY+nz*cY,e=ny*cT-c*sT,f=ny*sT+c*cT;
 let l=.3+.7*Math.max(0,a*LX+e*LY+f*LZ);
 const hh=a*HX+e*HY+f*HZ;if(hh>0)l+=.5*Math.pow(hh,20);
 l+=.2*Math.max(0,a*RX+e*RY+f*RZ);l*=sh;
 Z[k]=d;PT[k]=pt;KD[k]=flash?4:kind;LV[k]=flash?15:Math.min(15,Math.max(0,l*15|0));
}
function sc(x,y,z){const x1=x*cY+z*sY,z1=-x*sY+z*cY,up=y*cT-z1*sT;
 return[(gx0+x1*S)|0,(rows/2-(up-upMid)*S*cw/ch)|0,y*sT+z1*cT]}
function fx(x,y,z,lum,kind,chr){
 const[i,j,d]=sc(x,y,z);if(i<0||i>=cols||j<0||j>=rows)return;
 const k=j*cols+i;if(PT[k]>0&&PT[k]<255&&d<Z[k])return;
 CC[k]=chr.charCodeAt(0);KD[k]=kind;LV[k]=Math.min(15,Math.max(0,lum*15|0));PT[k]=255;Z[k]=Math.max(Z[k],d)}
function ray(i,j,n){
 for(let r=1;r<=n;r++){const v=Math.max(2,13-r*3);
  for(const[di,dj,c]of[[r*2,0,'-'],[-r*2,0,'-'],[0,r,'|'],[0,-r,'|']]){
   const a=i+di,b=j+dj;if(a<0||a>=cols||b<0||b>=rows)continue;const k=b*cols+a;
   if(PT[k]===0){CC[k]=c.charCodeAt(0);KD[k]=4;LV[k]=v;PT[k]=255}}}}

function render(t){
 Z.fill(-9);PT.fill(0);CC.fill(0);
 const head=(t-.5)/11*1.55,b=sm((t-10)/16),yaw=.22*Math.sin(t*.45)*sm((t-12)/4);
 if(Math.abs(b-lastB)>.006)build(b);
 cY=Math.cos(yaw);sY=Math.sin(yaw);
 const L=nrm([-.4,.55,.75]);LX=L[0];LY=L[1];LZ=L[2];
 const Hh=nrm([L[0],L[1],L[2]+1]);HX=Hh[0];HY=Hh[1];HZ=Hh[2];
 const R=nrm([Math.cos(t*.8),.3,Math.sin(t*.8)]);RX=R[0];RY=R[1];RZ=R[2];
 for(const p of ST)if(head>p[6])plot(p[0],p[1],p[2],p[3],p[4],p[5],0,p[7],.9,head-p[6]<.015);
 for(const p of LF)if(head>p[6])plot(p[0],p[1],p[2],p[3],p[4],p[5],1,p[7],.9,false);
 for(let i=0;i<NP;i++){const o=1+PX[i]*.5;if(head<=o)continue;const k=i*6,sj=PSJ[i];
  const tw=DEW[i]&&b>.9&&Math.sin(t*3+i)>.8;
  plot(PG[k],PG[k+1],PG[k+2],PG[k+3],PG[k+4],PG[k+5],2,PPT[i],.74+.26*sj,tw||head-o<.02);
 }
 const sp=[],body=q=>PT[q]>0&&PT[q]<255;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=j*cols+i;
  if(!body(k))continue;
  if(KD[k]===4){CC[k]=42;sp.push(i,j);continue}
  const o=(q,ok)=>ok?(!body(q)||(PT[q]!==PT[k]&&Z[q]<Z[k]-.06)?1:0):1;
  const eL=o(k-1,i>0),eR=o(k+1,i<cols-1),eU=o(k-cols,j>0),eD=o(k+cols,j<rows-1);
  if(eL|eR|eU|eD){
   const gx=eR-eL,gy=eD-eU,ax=Math.abs(gx),ay=Math.abs(gy);
   CC[k]=(ax>ay?'|':ay>ax?(gy>0?'_':'-'):(gx*gy>0?'/':'\\')).charCodeAt(0);
   LV[k]=Math.max(LV[k],13);if(KD[k]===2)KD[k]=5;
  }else{const sh=((i*7+j*13+(t*4|0))%3)-1;
   CC[k]=RAMP.charCodeAt(Math.min(RAMP.length-1,Math.max(1,((LV[k]/15)*(RAMP.length-1)|0)+sh)))}}
 if(head>0&&head<1.02){const c=stemC(Math.min(1,head)),q=sc(c[0],c[1],c[2]);fx(c[0],c[1],c[2],1,4,'*');ray(q[0],q[1],3)}
 for(const q of DUST){
  const a=q[0]*TAU+t*(.05+.08*q[1]),r=.55+1.5*Math.pow(q[2],.7),y=-1.2+2.6*q[3];
  const tw=Math.pow(Math.max(0,Math.sin(t*(1.2+2.5*q[1])+q[4]*40)),6),lum=(.1+.85*tw)*sm((t-2-q[3]*5)/2);
  if(lum<.05)continue;fx(Math.cos(a)*r,y,Math.sin(a)*r*.6-.2,lum,lum>.6?4:3,lum>.7?'*':lum>.35?'+':'.')}
 for(const[dx,dy,dz,t0]of DR){if(t<t0)continue;const tau=(t-t0)%12;
  if(tau<1.5)fx(dx,dy-.03*tau/1.5,dz,.85,3,'o');
  else{const u=tau-1.5,y=dy-.85*u*u;
   if(y>FL){for(let q=0;q<4;q++)fx(dx,y+q*.05*Math.min(1,u*2),dz,1-q*.2,q?3:4,q?'|':'*')}
   else{const w=u-Math.sqrt((dy-FL)/.85);
    if(w<.7)for(let k=0;k<8;k++){const a=k/8*TAU;fx(dx+Math.cos(a)*.4*w,FL+.5*w-1.2*w*w+.02,dz+Math.sin(a)*.2*w,1-w/.7,3,'.')}}}}
 for(let n=0;n<Math.min(4,sp.length/2);n++)ray(sp[n*2],sp[n*2+1],2+(Math.sin(t*6+n*1.7)>0?2:0));
 ctx.fillStyle='rgba(11,5,9,.55)';ctx.fillRect(0,0,W,H);
 ctx.font=`${(cw*1.72).toFixed(1)}px ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=j*cols+i;
  if(!CC[k])continue;ctx.fillStyle=STY[KD[k]][LV[k]];ctx.fillText(String.fromCharCode(CC[k]),(i+.5)*cw,(j+.5)*ch)}
 hint.style.opacity=t>28?1:0;
}

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 cw=Math.max(6,Math.round(W/92));ch=cw*1.7;cols=Math.floor(W/cw);rows=Math.floor(H/ch);
 const hi=1.15*cT+.7*sT,lo=-1.25*cT-.05;upMid=(hi+lo)/2;
 S=Math.min(cols*.9/1.5,rows*.92*ch/cw/(hi-lo));gx0=cols/2;gy0=rows/2-(.62*cT-upMid)*S*cw/ch;
 const n=cols*rows;Z=new Float32Array(n);CC=new Uint16Array(n);KD=new Uint8Array(n);LV=new Uint8Array(n);PT=new Uint8Array(n);
}
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0=performance.now(),last=0;
function loop(now){requestAnimationFrame(loop);if(now-last<30)return;last=now;render((now-t0)/1000)}
addEventListener('resize',()=>{resize();if(still)render(36)});
resize();
if(still)render(36);else requestAnimationFrame(loop);
cv.addEventListener('pointerdown',()=>{t0=performance.now();lastB=-1;ctx.fillStyle='#0b0509';ctx.fillRect(0,0,W,H)});
</script></body></html>
